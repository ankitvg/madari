summary = "Read-only Cloud SQL inspection for known targets, using Google's remote MCP server plus a bounded query policy."
good_for = ["schema and metadata lookup for a specified project, instance, and database", "row counts, grouped aggregates, and trend/debugging questions that can be answered with read-only SQL", "small bounded samples that avoid secrets and unnecessary PII", "incident or product questions where the desired output is a concise report plus the SQL used"]
not_for = ["schema changes, data writes, migrations, or stored procedure execution", "database user, IAM, backup, restore, import, or instance administration", "unbounded exports, table dumps, broad scans, or ad hoc data scraping", "credential, token, secret, or customer-data hunting beyond the user's explicit need"]
required_context = ["GCP project, Cloud SQL instance, and database", "SQL dialect or engine when it is not obvious", "the business question or debugging hypothesis to answer"]
optional_context = ["region, read replica preference, or connection target", "row limits, time windows, tenant/customer filters, and sensitive columns to avoid", "preferred output format such as summary, table, or query-only"]
expected_outputs = ["target context used (project, instance, database, and dialect if known)", "the SQL that passed the bundled read-only checker", "bounded result summary with row count, limits, truncation, or timeout signals", "caveats and recommended next read-only follow-up when the first query is inconclusive"]
